<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EVおでかけ特典マップ｜EV割引駐車場・特典・通行優遇</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Zen+Old+Mincho:wght@500&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  --asphalt:#1c2530; --asphalt-2:#2a3542; --paper:#f6f8fa; --line:#dfe4ea;
  --sign:#2356c9; --sign-soft:#e7eefc;
  --free:#2356c9; --rate:#7a3fc1; --ticket:#d98a00; --unk:#8a94a0;
  --ok:#1f8a5b; --warn:#c2410c;
  --ink:#1c2530; --ink-2:#5b6673;
  --r:10px;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;font-family:"Zen Kaku Gothic New",system-ui,sans-serif;color:var(--ink);background:var(--paper)}
.app{display:grid;grid-template-rows:auto 1fr;height:100vh;height:100dvh}
.stage{position:relative;min-height:0}
/* ---- タイトルパネル（全幅・常時表示） ---- */
.titlebar{position:relative;z-index:1300;background:var(--asphalt);color:#fff;padding:16px 20px 14px;display:flex;gap:15px;align-items:center}
.psign{flex:none;width:46px;height:46px;border-radius:8px;background:var(--sign);display:grid;place-items:center;
  font-family:"Zen Kaku Gothic New";font-weight:700;font-size:22px;line-height:1;letter-spacing:.02em;box-shadow:inset 0 0 0 3px #fff, 0 0 0 2px var(--sign)}
.titlebar h1{margin:0;font-family:"Zen Old Mincho",serif;font-weight:500;font-size:22px;letter-spacing:.12em;line-height:1.3}
.titlebar p{margin:3px 0 0;font-size:11.5px;color:#b8c3cf;line-height:1.5}
/* ---- 地図 ---- */
main{position:absolute;inset:0}
#map{position:absolute;inset:0;background:#e8ecef}
/* ---- 操作パネル（オーバーレイ） ---- */
aside{position:absolute;left:0;top:0;bottom:0;width:420px;max-width:92vw;z-index:1100;display:flex;flex-direction:column;min-height:0;background:#fff;border-right:1px solid var(--line);box-shadow:0 0 30px rgba(28,37,48,.18);transition:transform .35s ease}
.app.collapsed aside{transform:translateX(-105%)}
.ptoggle{border:1.5px solid var(--line);background:#fff;color:var(--ink);border-radius:50%;width:34px;height:34px;font-size:13px;cursor:pointer;line-height:1;display:grid;place-items:center;box-shadow:0 3px 12px rgba(28,37,48,.22)}
.ptoggle .ch{display:inline-block;transition:transform .3s}
.app.collapsed .ptoggle .ch{transform:rotate(180deg)}
.ptoggle:hover{border-color:var(--asphalt);color:var(--sign)}
.pbody{display:flex;flex-direction:column;flex:1;min-height:0}
.sec{display:flex;flex-direction:column;min-height:0}
.listhead{flex:none;display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.05em;background:var(--paper);border-bottom:1px solid var(--line);border-top:1px solid var(--line)}
.listhead .cnt{font-family:"JetBrains Mono";font-size:10.5px;font-weight:400;opacity:.8}
.sect{display:flex;align-items:center;gap:8px;width:100%;border:0;border-bottom:1px solid var(--line);background:var(--paper);padding:8px 14px;font:inherit;font-size:12px;font-weight:700;color:var(--ink-2);letter-spacing:.05em;cursor:pointer;text-align:left}
.sect:hover{color:var(--ink)}
.sect .ch{margin-left:auto;transition:transform .3s}
.sec.closed .sect .ch{transform:rotate(-90deg)}
.sec.closed .secbody{display:none!important}
.secbody.lst{display:flex;flex:1;min-height:0}
.sec .cnt{font-family:"JetBrains Mono";font-size:10.5px;font-weight:400;opacity:.8}
.hhandle{position:absolute;z-index:1250;width:34px;height:34px;border:1.5px solid var(--line);background:#fff;color:var(--ink-2);border-radius:50%;cursor:pointer;display:none;place-items:center;font-size:14px;box-shadow:0 3px 12px rgba(28,37,48,.25);transition:left .35s ease,top .35s ease}
.hhandle:hover{border-color:var(--asphalt);color:var(--sign)}
.hhandle .v{display:inline-block;transition:transform .35s}
.app.collapsed .hhandle .v{transform:rotate(180deg)}
/* PC: 展開時はパネル右端に外側へ張り付き、折りたたむと左端へ */
.hhandle{left:413px;top:50%;transform:translateY(-50%)}
.app.collapsed .hhandle{left:6px}
/* ---- 絞り込み ---- */
.controls{padding:12px 14px 10px;display:flex;flex-direction:column;gap:9px}
.search{position:relative}
.search input{width:100%;padding:10px 12px 10px 36px;border:1.5px solid var(--line);border-radius:var(--r);font:inherit;font-size:14px;background:var(--paper)}
.search input:focus{outline:none;border-color:var(--sign);background:#fff}
.search svg{position:absolute;left:11px;top:50%;transform:translateY(-50%);color:var(--ink-2)}
.frow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.flabel{font-size:11px;color:var(--ink-2);width:100%;margin-bottom:-2px;font-weight:700;letter-spacing:.05em}
.chip{border:1.5px solid var(--line);background:#fff;border-radius:999px;padding:4px 10px;font:inherit;font-size:12.5px;cursor:pointer;display:inline-flex;gap:6px;align-items:center;color:var(--ink)}
.chip[aria-pressed="true"]{border-color:var(--asphalt);background:var(--asphalt);color:#fff}
.chip:focus-visible,.card:focus-visible,button:focus-visible{outline:3px solid #f4b400;outline-offset:2px}
.chip .dot{width:10px;height:10px;border-radius:50%}
.chip .n{font-family:"JetBrains Mono";font-size:11px;opacity:.7}
.meta{display:flex;justify-content:space-between;align-items:center;padding:8px 14px;font-size:12px;color:var(--ink-2);border-top:1px solid var(--line);gap:8px}
.src{font-family:"JetBrains Mono";font-size:10.5px;padding:2px 7px;border-radius:5px;background:var(--sign-soft);color:var(--sign);white-space:nowrap}
/* ---- 一覧 ---- */
#list{overflow-y:auto;flex:1;min-height:0;padding:10px 12px 20px;display:flex;flex-direction:column;gap:8px}
.card{border:1.5px solid var(--line);border-radius:var(--r);padding:11px 12px 10px 14px;cursor:pointer;background:#fff;position:relative;transition:border-color .15s, box-shadow .15s}
.card:hover{border-color:#b9c3cf}
.card.active{border-color:var(--sign);box-shadow:0 0 0 3px var(--sign-soft)}
.card::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:4px;border-radius:0 4px 4px 0;background:var(--c)}
.card h3{margin:0 0 3px;font-size:15px;font-weight:700;display:flex;gap:6px;align-items:baseline;flex-wrap:wrap}
.card .addr{font-size:12px;color:var(--ink-2)}
.card .disc{margin-top:7px;font-size:13px;font-weight:700;color:var(--c)}
.card .disc.unk{color:var(--ink-2);font-weight:500}
.tags{display:flex;gap:5px;flex-wrap:wrap;margin-top:7px}
.tag{font-size:10.5px;padding:2px 7px;border-radius:4px;background:var(--paper);color:var(--ink-2);border:1px solid var(--line)}
.tag.ok{color:var(--ok);border-color:#bfe3d2;background:#eef8f3}
.tag.semi{color:#285b9a;border-color:#c8d8f0;background:#f1f6fd}
.tag.pdf{color:#8a5a00;border-color:#f0dcb0;background:#fdf7ea}
.tag.unk{color:var(--warn);border-color:#f3c9b3;background:#fdf1ec}
.tag.closed{color:#fff;background:var(--warn);border-color:var(--warn)}
.tag.soon{color:var(--warn);border-color:var(--warn);background:#fff}
.card a.lnk{color:inherit;text-decoration:none}
.card a.lnk:hover{border-color:var(--sign);color:var(--sign)}
.empty{padding:30px 10px;text-align:center;color:var(--ink-2);font-size:13px}
.btn{border:1.5px solid var(--asphalt);background:#fff;border-radius:8px;padding:6px 12px;font:inherit;font-size:12.5px;cursor:pointer}
.note{font-size:10.5px;color:var(--ink-2);padding:8px 14px;border-top:1px solid var(--line);background:var(--paper)}
/* ---- 凡例 ---- */
.legend{position:absolute;right:12px;bottom:22px;z-index:900;background:rgba(255,255,255,.96);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;font-size:11.5px;box-shadow:0 4px 16px rgba(28,37,48,.12);max-width:250px}
.legend b{display:block;font-size:10.5px;letter-spacing:.06em;color:var(--ink-2);margin:0 0 4px}
.legend .li{display:flex;align-items:center;gap:7px;margin:3px 0}
.legend .sw{width:14px;height:14px;border-radius:50%;flex:none}
.legend hr{border:0;border-top:1px solid var(--line);margin:7px 0}
.legend .toggle{display:none}
/* ---- ピン ---- */
.pin{width:26px;height:26px;border-radius:50% 50% 50% 0;transform:rotate(-45deg);background:var(--c);display:grid;place-items:center;border:3px solid #fff;box-shadow:0 2px 6px rgba(0,0,0,.35)}
.pin span{transform:rotate(45deg);color:#fff;font:700 11px/1 "Zen Kaku Gothic New",sans-serif}
.pin.semi{border-style:dashed;border-color:#fff}
.pin.weak{background:#fff;border:3px solid var(--c)}
.pin.weak span{color:var(--c)}
.pin.off{filter:grayscale(.85);opacity:.75}
.pin.sel{outline:3px solid #f4b400;outline-offset:1px}
/* ---- ポップアップ ---- */
.leaflet-popup-content{margin:12px 14px;font-family:"Zen Kaku Gothic New";font-size:12.5px;line-height:1.55;width:300px!important}
.pp h4{margin:0 0 2px;font-size:15.5px}
.pp .sub{color:var(--ink-2);font-size:11.5px;margin-bottom:8px}
.pp .big{background:var(--sign-soft);border-radius:8px;padding:7px 9px;margin-bottom:8px;font-weight:700;color:var(--c)}
.pp .big.unk{background:#fdf1ec;color:var(--warn)}
.pp dl{margin:0;display:grid;grid-template-columns:74px 1fr;gap:4px 8px}
.pp dt{color:var(--ink-2);font-size:11px;padding-top:1px}
.pp dd{margin:0;word-break:break-word}
.pp a{color:var(--sign);font-weight:700}
.pp .foot{margin-top:8px;padding-top:6px;border-top:1px dashed var(--line);font-size:10.5px;color:var(--ink-2)}
/* ---- モバイル ---- */
@media (max-width:820px){
  .app{display:block;height:100dvh;overflow:hidden}
  .titlebar{position:fixed;top:0;left:0;right:0;z-index:1300;padding:10px 14px}
  .titlebar h1{font-size:18px}
  .titlebar p{font-size:10.5px}
  .titlebar .psign{width:34px;height:34px;font-size:20px}
  .stage{position:fixed;inset:0}
  aside{position:fixed;top:auto;left:0;right:0;bottom:0;width:auto;max-width:none;height:62dvh;max-height:85dvh;border-radius:16px 16px 0 0;border:1px solid var(--line);box-shadow:0 -10px 34px rgba(28,37,48,.28);transform:translateY(0)}
  .app.collapsed aside{transform:translateY(calc(100% - 52px))}
  .pbody{height:calc(62dvh - 52px)}
  #list{overflow-y:auto;-webkit-overflow-scrolling:touch}
  /* モバイル: シート上端中央に横ハンドル（展開=下向き▼、折りたたみ=上向き▲） */
  .hhandle{display:grid;left:50%!important;top:calc(38dvh - 17px)!important;transform:translateX(-50%)}
  .app.collapsed .hhandle{top:calc(100dvh - 52px - 17px)!important;transform:translateX(-50%)}
  .hhandle .v{transform:rotate(-90deg)}
  .app.collapsed .hhandle .v{transform:rotate(90deg)}
  .ptoggle{width:30px;height:30px}
  .legend{top:8px;bottom:auto;right:8px;z-index:900;padding:6px 9px;font-size:11px;max-width:200px}
  .leaflet-popup-content{width:240px!important;max-height:60dvh;overflow-y:auto}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

</div>

const MODES = [
  {k:"無料時間制",hex:"#2356c9",s:"時"},
  {k:"割引率制",hex:"#7a3fc1",s:"%"},
  {k:"無料券制",hex:"#d98a00",s:"券"},
  {k:"割引",hex:"#0e9488",s:"引"},
  {k:"特典",hex:"#9333ea",s:"特"},
  {k:"要確認",hex:"#8a94a0",s:"?"}];
const CATS = [
  {k:"駐車場割引",hex:"#2356c9",g:null},
  {k:"施設・体験の特典",hex:"#0e9488",g:"特"},
  {k:"道路・通行",hex:"#b45309",g:"道"},
  {k:"地域施策",hex:"#9333ea",g:null}];
const STATUSES = ["稼働中","一時閉鎖","閉鎖予定"];
const CONFS = [
  {k:"公式サイト/サービスセンターで確認済",cls:"ok",pin:""},
  {k:"PDF記載のみ",cls:"pdf",pin:"weak"}];

const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, m => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]));

function normMode(r){
  const v=(r[COL.mode]||"").trim();
  if (MODES.some(m=>m.k===v)) return v;
  const t=(r[COL.amt]||"");
  if (/券/.test(t)) return "無料券制";
  if (/[%％]/.test(t)) return "割引率制";
  if (/無料|免除/.test(t) && !/要確認/.test(t)) return "無料時間制";
  return "要確認";
}
function normCat(r){const v=(r[COL.cat]||"").trim();return CATS.some(c=>c.k===v)?v:"駐車場割引";}
function normStatus(r){
  const v=(r[COL.status]||"").trim();
  if (STATUSES.includes(v)) return v;
  const n=r[COL.note]||"";
  if (/閉鎖予定|閉場予定/.test(n)) return "閉鎖予定";
  if (/一時閉鎖|一時閉場|休止/.test(n)) return "一時閉鎖";
  return "稼働中";
}
function normConf(r){
  const v=(r[COL.conf]||"").trim();
  if (CONFS.some(c=>c.k===v)) return v;
  const s=r[COL.src]||"";
  if (/未確認/.test(s)) return "PDF記載のみ";
  if (/確認/.test(s)) return "公式サイト/サービスセンターで確認済";
  return "PDF記載のみ";
}

let rows=[], markers={}, map, layer, activeId=null;
const state={q:"",cat:new Set(),status:new Set(),conf:new Set(),pre:new Set()};

function prepare(data){
  return data.filter(r => (r[COL.name]||"").trim() && (r[COL.pub]||"掲載").trim()!=="非掲載")
    .map((r,i) => {
      const lat=parseFloat(r[COL.lat]), lng=parseFloat(r[COL.lng]);
      return {...r, _id:(r[COL.id]||("R"+i)).trim(), _lat:lat, _lng:lng, _geo:isFinite(lat)&&isFinite(lng),
        _mode:normMode(r), _cat:normCat(r), _status:normStatus(r), _conf:normConf(r),
        _kind:(r[COL.kind]||"").trim(), _target:(r[COL.target]||"").trim(), _expiry:(r[COL.expiry]||"").trim(),
        _mem:(r[COL.shape]||"").trim()==="面"?[r[COL.name]]:[(r[COL.mem]||"")].flatMap(s=>["阿蘇市（EVおもてなしスポット）","津久井地域（ゼロカーボンさがみはら）","滋賀・琵琶湖周辺（戦国ディスカバリー）","千葉・南房総（EV Drive Map）"].filter(a=>s.includes(a))),
        _pre:/^要/.test((r[COL.how]?r[COL.how]:"")+(r[COL.kind]||""))===true?/^事前申請必要$/.test((r[COL.kind]||"").trim()):false,
        _preUrl:(r[COL.preUrl]||"").trim(),
        _shape:((r[COL.shape]||"点").trim()||"点"), _radius:parseFloat(r[COL.radiuskm])||0,
        _hay:[r[COL.name],r[COL.addr],r[COL.city],r[COL.mgr],r[COL.amt],r[COL.target],r[COL.how],r[COL.note]].join(" ").toLowerCase()};
    });
}

function loadCSV(){
  const override=new URLSearchParams(location.search).get("csv");
  const url=(override||CSV_URL||"").trim();
  if(!url){ start(prepare(FALLBACK_ROWS), null); return; }
  Papa.parse(url,{download:true,header:true,skipEmptyLines:true,
    complete:res=>{
      const d=prepare(res.data||[]);
      if(!d.length){ start(prepare(FALLBACK_ROWS), null); return; }
      start(d,"外部CSVを読み込み中（"+d.length+"件）");
    },
    error:()=>start(prepare(FALLBACK_ROWS), null)});
}

function chip(container,key,label,color,count){
  if(!count) return;
  const b=document.createElement("button");
  b.className="chip"; b.type="button"; b.setAttribute("aria-pressed","false");
  b.innerHTML=(color?`<span class="dot" style="background:${color}"></span>`:"")+esc(label)+` <span class="n">${count}</span>`;
  b.onclick=()=>{const s=state[key]; s.has(label)?s.delete(label):s.add(label); b.setAttribute("aria-pressed",s.has(label)); render();};
  container.appendChild(b);
}

function start(data,label){
  rows=data;
  if(label){ const src=$("#src"); src.textContent=label; src.style.display=""; }
  CATS.forEach(c=>chip($("#f-cat"),"cat",c.k,c.hex,
    c.k==="地域施策"?rows.filter(r=>r._cat==="地域施策"||(r._mem||[]).length>0).length:rows.filter(r=>r._cat===c.k).length));
  STATUSES.forEach(s=>chip($("#f-status"),"status",s,null,rows.filter(r=>r._status===s).length));
  CONFS.forEach(c=>chip($("#f-conf"),"conf",c.k,null,rows.filter(r=>r._conf===c.k).length));
  chip($("#f-pre"),"pre","事前申請必要","var(--ticket)",rows.filter(r=>r._kind==="事前申請必要").length);
  chip($("#f-pre"),"pre","リーフレット必要","#0e9488",rows.filter(r=>r._kind==="リーフレット必要").length);

  map=L.map("map",{zoomControl:true}).setView([35.69,139.70],11);
  L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",{maxZoom:19,
    attribution:'&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'}).addTo(map);
  layer=L.featureGroup().addTo(map);
  rows.forEach(r=>{
    const m=MODES.find(x=>x.k===r._mode)||MODES[MODES.length-1], c=CONFS.find(x=>x.k===r._conf)||CONFS[CONFS.length-1];
    const cat=CATS.find(x=>x.k===r._cat)||CATS[0];
    const off=r._status!=="稼働中"?" off":"";
    const hex=r._cat==="駐車場割引"?m.hex:cat.hex;
    let mk;
    if(r._shape==="面"&&r._radius>0&&r._geo){
      const kw=["阿蘇","津久井","相模原","滋賀","千葉"];
      mk=L.circle([r._lat,r._lng],{radius:r._radius*1000,color:hex,weight:1.5,fillColor:hex,fillOpacity:.12,dashArray:"4 4"})
        .bindPopup(()=>popup(r)+`<div style="margin-top:8px;text-align:center"><button class="btn" onclick='zoomArea(${r._lat},${r._lng},"${esc(r[COL.name])}")'>この地域の特典をすべて表示</button></div>`,{maxWidth:320,autoPanPaddingTopLeft:[10,60]});
      mk.on("click",()=>select(r._id,false));
    } else {
      if(!r._geo) return;
      const glyph=cat.g||m.s;
      const icon=L.divIcon({className:"",iconSize:[26,26],iconAnchor:[13,26],popupAnchor:[0,-24],
        html:`<div class="pin ${c.pin}${off}" data-id="${esc(r._id)}" style="--c:${hex}"><span>${glyph}</span></div>`});
      mk=L.marker([r._lat,r._lng],{icon,title:r[COL.name],riseOnHover:true})
        .bindPopup(()=>popup(r),{maxWidth:320,autoPanPaddingTopLeft:[10,60]});
      mk.on("click",()=>select(r._id,false));
    }
    markers[r._id]=mk;
  });
  $("#q").addEventListener("input",e=>{state.q=e.target.value.trim().toLowerCase(); render();});
  render(false);
  buildLegend();
}

function filtered(){
  const qs=state.q.split(/\s+/).filter(Boolean);
  const areaMode=state.cat.has("地域施策");
  return rows.filter(r=>{
    if(!qs.every(q=>r._hay.includes(q))) return false;
    if(!state.status.size||!state.status.size===false){} // noop
    if(state.status.size&&!state.status.has(r._status)) return false;
    if(state.conf.size&&!state.conf.has(r._conf)) return false;
    if(state.pre.size&&!state.pre.has(r._kind)) return false;
    if(areaMode){ return r._cat==="地域施策"||(r._mem||[]).length>0; }
    if(state.cat.size&&!state.cat.has(r._cat)) return false;
    return true;
  });
}

function discLine(r){
  const a=(r[COL.amt]||"").trim(), m=(r[COL.mode]||"").trim();
  let s=a?a:"要確認";
  if(m && m!=="要確認" && !s.includes(m)) s+=`（${m}）`;
  if(m==="要確認" && !/^要確認/.test(s)) s+="（方式は要確認）";
  return s;
}
function isUnk(r){ return r._mode==="要確認" || /^要確認/.test(r[COL.amt]||""); }

function render(fit){
  const list=$("#list"), f=filtered();
  $("#count").textContent=`${f.length}件を表示／全${rows.length}件`;
  const c2=$("#cnt2"); if(c2) c2.textContent=`${f.length}件`;
  layer.clearLayers();
  f.forEach(r=>{ if(markers[r._id]) layer.addLayer(markers[r._id]); });
  if(!f.length){
    list.innerHTML=`<div class="empty">条件に合う施設がありません。<br>検索語を短くするか、絞り込みを解除してください。<br><button class="btn" id="clr">絞り込みをすべて解除</button></div>`;
    $("#clr").onclick=clearAll; return;
  }
  list.innerHTML=f.map(r=>{
    const c=CONFS.find(x=>x.k===r._conf), cat=CATS.find(x=>x.k===r._cat);
    const st=r._status==="一時閉鎖"?`<span class="tag closed">一時閉鎖</span>`:r._status==="閉鎖予定"?`<span class="tag soon">閉鎖予定</span>`:"";
    const pre=r._preUrl?`<a class="tag pdf lnk" href="${esc(r._preUrl)}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${r._kind==="リーフレット必要"?"リーフレット（PDF）↗":"事前申請必要・PDF ↗"}</a>`:(r._kind==="事前申請必要"?'<span class="tag pdf">事前申請必要</span>':"");
    return `<div class="card${r._id===activeId?" active":""}" role="listitem" tabindex="0" data-id="${esc(r._id)}" style="--c:${cat.hex}">
      <h3>${esc(r[COL.name])} ${st}</h3>
      <div class="addr">${esc(r[COL.addr])}${r[COL.mgr]?`　<span style="opacity:.8">${esc(r[COL.mgr])}</span>`:""}</div>
      <div class="disc${isUnk(r)?" unk":""}">${esc(discLine(r))}</div>
      <div class="tags"><span class="tag" style="color:${cat.hex};border-color:${cat.hex};font-weight:700">${esc(r._cat)}</span><span class="tag ${c.cls}">${esc(r._conf)}</span>${pre}${r._geo?"":'<span class="tag unk">座標なし</span>'}</div>
    </div>`;}).join("");
  list.querySelectorAll(".card").forEach(el=>{
    const go=()=>select(el.dataset.id,true);
    el.onclick=go; el.onkeydown=e=>{ if(e.key==="Enter"||e.key===" "){e.preventDefault();go();} };
  });
  if(fit && layer.getLayers().length) map.fitBounds(layer.getBounds(),{padding:[30,30]});
}

function clearAll(){
  state.q=""; $("#q").value=""; ["cat","status","conf","pre"].forEach(k=>state[k].clear());
  document.querySelectorAll(".chip").forEach(b=>b.setAttribute("aria-pressed","false")); render(true);
}

function select(id,fromCard){
  activeId=id;
  document.querySelectorAll(".card").forEach(el=>el.classList.toggle("active",el.dataset.id===id));
  document.querySelectorAll(".pin").forEach(el=>el.classList.toggle("sel",el.dataset.id===id));
  const mk=markers[id];
  if(fromCard){
    if(window.matchMedia("(max-width:820px)").matches) appEl.classList.add("collapsed");
    if(mk){ const ll=mk.getLatLng?mk.getLatLng():mk.getBounds().getCenter();
      map.flyTo(ll,Math.max(map.getZoom(),13),{duration:.6}); map.once("moveend",()=>{mk.openPopup(); markPin(id);}); }
  } else {
    const card=document.querySelector(`.card[data-id="${CSS.escape(id)}"]`);
    if(card) card.scrollIntoView({block:"nearest",behavior:"smooth"});
  }
}
function markPin(id){ document.querySelectorAll(".pin").forEach(el=>el.classList.toggle("sel",el.dataset.id===id)); }
function zoomArea(lat,lng,areaName){
  map.flyTo([lat,lng],11.5,{duration:.7});
  setTimeout(()=>{ state.cat=new Set(["地域施策"]); state.pre.clear(); syncChips(); render(); },760);
}
function syncChips(){
  document.querySelectorAll("#f-cat .chip,#f-status .chip,#f-conf .chip,#f-pre .chip").forEach(b=>{
    const label=b.textContent.replace(/\s*\d+\s*$/,"").trim();
    const key=b.closest("#f-cat")?"cat":b.closest("#f-pre")?"pre":b.closest("#f-status")?"status":"conf";
    b.setAttribute("aria-pressed",String(state[key].has(label)));});
}

function popup(r){
  const u=(r[COL.url]||"").trim(); const m=MODES.find(x=>x.k===r._mode);
  const CH={}; CATS.forEach(x=>CH[x.k]=x.hex);
  const row=(k,v)=>v?`<dt>${k}</dt><dd>${v}</dd>`:"";
  const preLnk=r._preUrl?`　<a href="${esc(r._preUrl)}" target="_blank" rel="noopener">${r._kind==="リーフレット必要"?"リーフレット（PDF）を開く":(/\.pdf$/i.test(r._preUrl)?"申請用PDFを開く":"申請・確認ページを開く")} ↗</a>`:"";
  return `<div class="pp" style="--c:${CH[r._cat]||m.hex}">
    <h4>${esc(r[COL.name])}</h4>
    <div class="sub">${esc(r._cat)}｜${esc(r._status)}${r[COL.rank]?`｜対象ランク ${esc(r[COL.rank])}`:""}</div>
    <div class="big${isUnk(r)?" unk":""}">${esc(discLine(r))}</div>
    <dl>
      ${row("対象車種",esc(r._target))}
      ${row("有効期限",esc(r._expiry))}
      ${row("住所",esc(r[COL.addr]))}
      ${r[COL.mgr]?row("管理会社",esc(r[COL.mgr])):""}
      ${r._shape==="面"&&r[COL.mem]?row("地域内の特典",esc(r[COL.mem]).replace(/;/g,"、")):""}
      ${r._mem.length&&!r._preUrl?row("地域内の特典",r._mem.map(esc).join("、")):""}
      ${row("連絡先",esc(r[COL.tel]))}
      ${row("利用方法",esc(r[COL.how]))}
      ${row("事前申請",(r._kind?esc(r._kind):"不要")+preLnk)}
      ${row("状態備考",esc(r[COL.note]))}
      ${row("公式URL",u?`<a href="${esc(u)}" target="_blank" rel="noopener">公式ページを開く ↗</a>`:"公式ページ未発見")}
    </dl>
    <div class="foot">情報源：${esc(r[COL.src])}<br>確からしさ：${esc(r._conf)}｜最終確認日：${esc(r[COL.date])}</div>
  </div>`;
}

const appEl=document.querySelector(".app");
$("#pt").onclick=()=>{const c=appEl.classList.toggle("collapsed"); $("#pt").setAttribute("aria-expanded",String(!c));};
document.querySelectorAll(".sect").forEach(bt=>bt.onclick=()=>{const s=document.getElementById(bt.dataset.s); const c=s.classList.toggle("closed"); bt.setAttribute("aria-expanded",String(!c));});
$("#lgT").onclick=()=>{const l=$("#legend"); l.classList.toggle("open"); $("#lgT").setAttribute("aria-expanded",l.classList.contains("open"));};

const CONF_SW={"":"background:var(--free);border:2px solid #fff;box-shadow:0 0 0 1px #999","semi":"background:var(--free);border:2px dashed #fff;box-shadow:0 0 0 1px #999","weak":"background:#fff;border:3px solid var(--free)"};
function buildLegend(){
  const has=(k,v)=>rows.some(r=>r[k]===v);
  let h='<b>色＝特典の種類</b>'+CATS.filter(c=>has("_cat",c.k)).map(c=>`<div class="li"><span class="sw" style="background:${c.hex}"></span>${esc(c.k)}${c.k==="地域施策"?"（薄い円）":""}</div>`).join("");
  h+='<hr><b>ピンの縁＝確からしさ</b>'+CONFS.filter(c=>has("_conf",c.k)).map(c=>`<div class="li"><span class="sw" style="${CONF_SW[c.pin]}"></span>${c.pin==="weak"?"PDF記載のみ／未確認":esc(c.k)}</div>`).join("");
  if(rows.some(r=>r._status!=="稼働中")) h+='<div class="li"><span class="sw" style="background:#999;opacity:.6"></span>一時閉鎖・閉鎖予定</div>';
  $("#lgBody").innerHTML=h;
}
loadCSV();
